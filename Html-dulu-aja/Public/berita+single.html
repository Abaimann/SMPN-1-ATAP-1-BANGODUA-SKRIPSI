<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warta Cendekia — Portal Berita SMP Cendekia Bangsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12233D;
    --navy:#0E2A47;
    --blue:#1C4E80;
    --blue-soft:#EAF1F8;
    --sky:#4A90C4;
    --amber:#E8A33D;
    --paper:#F5F8FB;
    --line:#DCE6F0;
    --white:#FFFFFF;
    --muted:#5B7089;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  .serif{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    letter-spacing:-0.01em;
  }

  /* focus visibility */
  a:focus-visible, button:focus-visible{
    outline:2px solid var(--sky);
    outline-offset:3px;
    border-radius:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ===== Masthead ===== */
  .masthead{
    background:var(--navy);
    color:var(--white);
    padding:28px 0 22px;
  }
  .masthead .wrap{
    max-width:1120px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;gap:16px;
  }
  .mark{
    width:52px;height:52px;flex:none;
    border-radius:10px;
    background:linear-gradient(160deg,var(--blue),var(--sky));
    display:flex;align-items:center;justify-content:center;
  }
  .masthead h1{
    margin:0;
    font-size:2rem;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .masthead .tagline{
    margin:2px 0 0;
    color:#9FBAD6;
    font-size:0.92rem;
  }

  main{max-width:1120px;margin:0 auto;padding:36px 24px 64px;}

  /* ===== Home layout ===== */
  .layout{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:36px;
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }
  .layout aside{
    display:block;
    position:sticky;
    top:24px;
    align-self:start;
  }
  @media (max-width:860px){
    .layout aside{
      display:none;
    }
  }

  /* ===== Animations ===== */
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  /* Sidebar slides in from the right, nice and slow */
  @keyframes slideInFromRight{
    0%{opacity:0; transform:translateX(56px);}
    60%{opacity:1;}
    100%{opacity:1; transform:translateX(0);}
  }
  /* Small article cards slide in from the right, staggered */
  @keyframes cardInFromRight{
    0%{opacity:0; transform:translateX(48px) scale(.98);}
    70%{opacity:1;}
    100%{opacity:1; transform:translateX(0) scale(1);}
  }

  .layout aside.side-anim{
    animation:slideInFromRight 1.1s cubic-bezier(.22,.68,.32,1) both;
    animation-delay:.15s;
  }
  .layout aside.side-anim .side-block:nth-child(2){
    animation:slideInFromRight 1.1s cubic-bezier(.22,.68,.32,1) both;
    animation-delay:.35s;
  }

  .card{
    animation:cardInFromRight .9s cubic-bezier(.22,.68,.32,1) both;
  }

  .related-card{
    animation:cardInFromRight .9s cubic-bezier(.22,.68,.32,1) both;
  }

  /* Hero */
  .hero{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:28px;
    padding-bottom:32px;
    border-bottom:1px solid var(--line);
    margin-bottom:32px;
    animation:rise .8s ease both;
  }
  @media (max-width:700px){
    .hero{grid-template-columns:1fr;}
  }
  .hero-media{
    aspect-ratio:4/3;
    border-radius:14px;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 45%),
      linear-gradient(155deg,var(--blue),var(--navy) 78%);
    position:relative;
    overflow:hidden;
  }
  .hero-media svg{position:absolute; inset:0; width:100%; height:100%;}
  .hero-media img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.74rem;
    font-weight:700;
    padding:4px 11px;
    border-radius:20px;
    background:var(--blue-soft);
    color:var(--blue);
  }
  .tag.prestasi{background:#FCEFDA;color:#9A6417;}
  .tag.akademik{background:var(--blue-soft);color:var(--blue);}
  .tag.eskul{background:#E4F1EA;color:#2A7A52;}
  .tag.pengumuman{background:#F4E7EA;color:#9A3B4C;}
  .tag.acara{background:#EAEBF8;color:#4E4FA3;}

  .hero-body h2{
    font-size:2.15rem;
    line-height:1.12;
    margin:14px 0 10px;
    font-weight:600;
  }
  .hero-body p.dek{
    color:var(--muted);
    font-size:1.02rem;
    line-height:1.55;
    margin:0 0 16px;
  }
  .byline{
    font-size:0.84rem;
    color:var(--muted);
    display:flex;
    gap:10px;
    align-items:center;
  }
  .byline .dividerdot{
    width:3px;height:3px;border-radius:50%;background:var(--muted);
  }
  .read-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:18px;
    font-weight:700;
    color:var(--blue);
    font-size:0.92rem;
    cursor:pointer;
  }
  .read-link .arrow{transition:transform .15s ease;}
  .read-link:hover .arrow{transform:translateX(4px);}

  /* Secondary grid */
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .section-head h3{
    font-size:1.3rem;
    margin:0;
    font-weight:600;
  }
  .grid-articles{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:22px;
    margin-bottom:8px;
  }
  @media (max-width:560px){
    .grid-articles{grid-template-columns:1fr;}
  }
  .card{
    cursor:pointer;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    transition:transform .18s ease;
  }
  .card:active{transform:scale(.98);}
  .card .thumb{
    aspect-ratio:16/10;
    border-radius:10px;
    margin-bottom:12px;
    background:linear-gradient(160deg, var(--sky), var(--blue));
    position:relative;overflow:hidden;
  }
  .card .thumb svg{position:absolute; inset:0; width:100%; height:100%;}
  .card .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .card h4{
    font-size:1.08rem;
    line-height:1.32;
    margin:10px 0 8px;
    font-weight:600;
    transition:color .12s ease;
  }
  .card:hover h4{color:var(--blue);}
  .card p.excerpt{
    font-size:0.88rem;
    color:var(--muted);
    line-height:1.5;
    margin:0 0 8px;
  }

  /* Pagination */
  .pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:28px;
  }
  .pagination button{
    font-family:inherit;
    font-size:0.9rem;
    font-weight:700;
    min-width:38px;
    height:38px;
    padding:0 10px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--blue);
    cursor:pointer;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .pagination button:hover:not(:disabled){
    background:var(--blue-soft);
    border-color:var(--sky);
  }
  .pagination button.active{
    background:var(--blue);
    border-color:var(--blue);
    color:var(--white);
  }
  .pagination button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  /* Sidebar */
  .side-block{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:24px;
  }
  .side-block h3{
    font-size:1.05rem;
    margin:0 0 14px;
    font-weight:700;
    color:var(--blue);
  }
  .announce-item{
    padding:12px 0;
    border-top:1px solid var(--line);
    font-size:0.9rem;
    line-height:1.45;
  }
  .announce-item:first-of-type{border-top:none; padding-top:0;}
  .announce-item .date-chip{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    color:var(--amber);
    margin-bottom:4px;
  }
  .agenda-item{
    display:flex;
    gap:12px;
    padding:11px 0;
    border-top:1px solid var(--line);
    font-size:0.88rem;
  }
  .agenda-item:first-of-type{border-top:none; padding-top:0;}
  .agenda-date{
    flex:none;
    width:44px;
    text-align:center;
    background:var(--blue-soft);
    color:var(--blue);
    border-radius:8px;
    padding:5px 0;
    font-weight:700;
    line-height:1.1;
  }
  .agenda-date span{display:block;font-size:0.65rem;font-weight:600;}

  /* ===== Article view ===== */
  #view-article{display:none;}
  .breadcrumb{
    font-size:0.84rem;
    color:var(--muted);
    margin-bottom:18px;
  }
  .breadcrumb .back{
    color:var(--blue);
    font-weight:700;
    cursor:pointer;
  }
  .article-wrap{
    max-width:760px;
    margin:0 auto;
  }
  .article-wrap h1.title{
    font-size:2.4rem;
    line-height:1.14;
    margin:16px 0 14px;
    font-weight:600;
  }
  @media (max-width:600px){
    .article-wrap h1.title{font-size:1.7rem;}
  }
  .article-meta{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    color:var(--muted);
    font-size:0.88rem;
    padding-bottom:22px;
    margin-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .cover{
    aspect-ratio:16/9;
    border-radius:14px;
    margin-bottom:26px;
    background:linear-gradient(155deg,var(--blue),var(--navy) 78%);
    position:relative;overflow:hidden;
    animation:rise .7s ease both;
  }
  .cover svg{position:absolute; inset:0; width:100%; height:100%;}
  .cover img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .article-body p{
    font-size:1.08rem;
    line-height:1.75;
    margin:0 0 20px;
    color:#233752;
  }
  .article-body .lead{
    font-size:1.2rem;
    color:var(--ink);
  }
  blockquote.pull{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.4rem;
    line-height:1.45;
    color:var(--blue);
    border-left:3px solid var(--amber);
    padding:4px 0 4px 22px;
    margin:32px 0;
  }
  .related{
    margin-top:44px;
    padding-top:28px;
    border-top:1px solid var(--line);
  }
  .related h3{
    font-size:1.15rem;
    margin:0 0 16px;
    font-weight:700;
  }
  .related-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
  }
  @media (max-width:600px){
    .related-list{grid-template-columns:1fr;}
  }
  .related-card{
    cursor:pointer;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  .related-card:hover{
    border-color:var(--sky);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(18,35,61,0.08);
  }
  .related-card .thumb{
    aspect-ratio:16/9;
    background:linear-gradient(160deg, var(--sky), var(--blue));
    position:relative;
    overflow:hidden;
  }
  .related-card .thumb svg{position:absolute; inset:0; width:100%; height:100%;}
  .related-card .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .related-card .rc-body{
    padding:14px;
  }
  .related-card .tag{
    margin-bottom:8px;
  }
  .related-card h4{
    font-size:0.96rem;
    line-height:1.35;
    margin:0 0 8px;
    font-weight:600;
    transition:color .12s ease;
  }
  .related-card:hover h4{color:var(--blue);}
  .related-card .rc-meta{
    font-size:0.78rem;
    color:var(--muted);
  }

  /* ===== Footer ===== */
  footer{
    background:var(--navy);
    color:#9FBAD6;
    padding:36px 0 26px;
    margin-top:20px;
  }
  footer .wrap{
    max-width:1120px;margin:0 auto;padding:0 24px;
    display:flex;justify-content:space-between;
    flex-wrap:wrap; gap:16px;
    font-size:0.85rem;
  }
  footer strong{color:var(--white);}
</style>
</head>

  <main>

      </div>
    </div>
  </main>

/* ============ Render Home ============ */
const PAGE_SIZE = 4;
let currentPage = 1;
let currentFilter = "Semua";

function renderHome(filterCat){
  currentFilter = filterCat || "Semua";
  currentPage = 1;
  renderPage();
}

function articleImg(article, alt){
  return `<img src="${article.img}" alt="${alt}" loading="lazy" onerror="this.style.display='none'">`;
}

function renderPage(){
  const list = currentFilter && currentFilter!=="Semua" ? articles.filter(a=>a.cat===currentFilter) : articles;
  const hero = list.find(a=>a.hero) || list[0];
  const rest = list.filter(a=>a.id !== (hero ? hero.id : null));

  document.getElementById('hero').innerHTML = hero ? `
    <div class="hero-media">${articleImg(hero, hero.title)}</div>
    <div class="hero-body">
      <span class="tag ${hero.tagClass}">${hero.cat}</span>
      <h2 class="serif">${hero.title}</h2>
      <p class="dek">${hero.dek}</p>
      <div class="byline"><span>${hero.author}</span><span class="dividerdot"></span><span>${hero.date}</span></div>
      <div class="read-link" onclick="showArticle(${hero.id})">Baca selengkapnya <span class="arrow">→</span></div>
    </div>` : `<p>Belum ada berita pada kategori ini.</p>`;

  const totalPages = Math.max(1, Math.ceil(rest.length / PAGE_SIZE));
  if(currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = rest.slice(start, start + PAGE_SIZE);

  document.getElementById('grid-articles').innerHTML = pageItems.map((a, i)=>`
    <div class="card" style="animation-delay:${0.12 * i}s" onclick="showArticle(${a.id})">
      <div class="thumb">${articleImg(a, a.title)}</div>
      <span class="tag ${a.tagClass}">${a.cat}</span>
      <h4 class="serif">${a.title}</h4>
      <p class="excerpt">${a.dek}</p>
      <div class="byline"><span>${a.date}</span></div>
    </div>
  `).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const el = document.getElementById('pagination');
  if(totalPages <= 1){ el.innerHTML=''; return; }

  let html = `<button ${currentPage===1?'disabled':''} onclick="goToPage(${currentPage-1})" aria-label="Sebelumnya">‹</button>`;
  for(let p=1; p<=totalPages; p++){
    html += `<button class="${p===currentPage?'active':''}" onclick="goToPage(${p})">${p}</button>`;
  }
  html += `<button ${currentPage===totalPages?'disabled':''} onclick="goToPage(${currentPage+1})" aria-label="Berikutnya">›</button>`;
  el.innerHTML = html;
}

function goToPage(p){
  currentPage = p;
  renderPage();
  document.querySelector('.grid-articles').scrollIntoView({behavior:'smooth', block:'start'});
}

const announcements = [
  {date:"24 SEP", text:"Sekolah libur dalam rangka Maulid Nabi Muhammad SAW."},
  {date:"16 SEP", text:"UTS Ganjil dimulai — pastikan alat tulis lengkap."},
  {date:"10 SEP", text:"Pembayaran seragam batik dibuka hingga akhir bulan."}
];
const agenda = [
  {d:"16", m:"SEP", text:"Mulai UTS Ganjil kelas VII–IX"},
  {d:"24", m:"SEP", text:"Libur Maulid Nabi Muhammad SAW"},
  {d:"03", m:"OKT", text:"Panggung Seni Pelajar 2026"},
  {d:"12", m:"OKT", text:"Rapat orang tua & wali murid"}
];

function renderSidebar(){
  const announceHtml = announcements.map(a=>`
    <div class="announce-item">
      <span class="date-chip">${a.date}</span>
      <div>${a.text}</div>
    </div>
  `).join('');

  const agendaHtml = agenda.map(a=>`
    <div class="agenda-item">
      <div class="agenda-date">${a.d}<span>${a.m}</span></div>
      <div>${a.text}</div>
    </div>
  `).join('');

  ['announce-list','announce-list-article'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.innerHTML = announceHtml;
  });
  ['agenda-list','agenda-list-article'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.innerHTML = agendaHtml;
  });
}

/* ============ Render Article ============ */
function showArticle(id){
  const art = articles.find(a=>a.id===id);
  if(!art) return;

  document.getElementById('art-tag').className = 'tag ' + art.tagClass;
  document.getElementById('art-tag').textContent = art.cat;
  document.getElementById('crumb-cat').textContent = ' / ' + art.cat;
  document.getElementById('art-title').textContent = art.title;
  document.getElementById('art-author').textContent = art.author;
  document.getElementById('art-date').textContent = art.date;
  document.getElementById('art-read').textContent = art.read;
  document.getElementById('art-cover').innerHTML = articleImg(art, art.title);

  let bodyHtml = art.body.map((p,i)=>`<p class="${i===0?'lead':''}">${p}</p>`).join('');
  if(art.quote){
    const mid = Math.ceil(art.body.length/2);
    const before = art.body.slice(0,mid).map((p,i)=>`<p class="${i===0?'lead':''}">${p}</p>`).join('');
    const after = art.body.slice(mid).map(p=>`<p>${p}</p>`).join('');
    bodyHtml = before + `<blockquote class="pull">"${art.quote}"</blockquote>` + after;
  }
  document.getElementById('art-body').innerHTML = bodyHtml;

  const related = articles.filter(a=>a.id!==art.id && a.cat===art.cat).slice(0,2);
  const fallback = articles.filter(a=>a.id!==art.id && a.cat!==art.cat).slice(0, 2-related.length);
  const relatedFinal = [...related, ...fallback];
  document.getElementById('related-list').innerHTML = relatedFinal.map((r, i)=>`
    <div class="related-card" style="animation-delay:${0.12 * i}s" onclick="showArticle(${r.id})">
      <div class="thumb">${articleImg(r, r.title)}</div>
      <div class="rc-body">
        <span class="tag ${r.tagClass}">${r.cat}</span>
        <h4 class="serif">${r.title}</h4>
        <div class="rc-meta">${r.date} · ${r.read}</div>
      </div>
    </div>
  `).join('');

  document.getElementById('view-home').style.display='none';
  document.getElementById('view-article').style.display='block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function showHome(){
  document.getElementById('view-article').style.display='none';
  document.getElementById('view-home').style.display='block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ Init ============ */
renderHome("Semua");
renderSidebar();
</script>
